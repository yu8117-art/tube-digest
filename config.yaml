# Tube Digest 동작 설정. 비밀값(API 키, 봇 토큰)은 여기 말고 .env(로컬)와 GitHub Secrets(Actions)에 둔다.
# 구독 채널 목록은 channels.yaml (.\td add "@핸들").

options:
  skip_shorts: true            # 쇼츠는 요약하지 않음
  skip_live: true              # 라이브 방송 다시보기는 요약하지 않음 (몇 시간짜리 중계·청약 라이브 등)
  max_video_minutes: 180       # 이보다 긴 영상은 영상 분석 없이 제목·설명·썸네일만으로 요약 (무료 한도 보호)
  max_videos_per_run: 5        # 한 번 실행에 요약할 최대 영상 수 (무료 한도 보호)
  run_budget_minutes: 35       # 실행 시작 후 이 시간이 지나면 새 영상 처리를 멈추고 기록을 저장 (Actions 60분 제한 대응)
  backfill_on_first_run: 0     # 채널을 처음 등록할 때 최근 영상 몇 개를 요약할지 (0 = 이후 새 영상만)
  git_push: true               # 처리 기록(data/)을 저장소에 커밋. GitHub Actions로 돌릴 때 필수

# Gemini가 영상(유튜브 URL)과 썸네일을 직접 보고 prompts/summary_prompt.md 대로 요약한다. GEMINI_API_KEY 필요.
gemini:
  # 위에서부터 차례로 쓴다. 무료 한도는 모델마다 따로라서, 한 모델이 한도 초과·과부하면 다음 모델로 넘어간다.
  # 실측(2026-10-12): 3.8-flash는 무료 하루 20회뿐 + 과부하 잦음 / 3.6-flash는 품질 좋음(12분 영상 2.5분)
  #                   / 3.5-flash-lite는 빠름(27초)이나 시간대를 가끔 틀림(영상 길이를 넘는 시간대는 자동 제거)
  models:
    - gemini-3.6-flash
    - gemini-3.5-flash-lite
    - gemini-3.8-flash
  segment_minutes: 30          # 이보다 긴 영상은 구간별로 노트를 만든 뒤 요약 (요청당 토큰 한도 대응)
  pause_sec: 60                # 영상 분석 호출 사이 최소 간격 (분당 토큰 한도 대응)
  call_timeout_minutes: 10     # Gemini 호출 1번의 최대 대기 시간. 넘기면 그 모델은 이번 실행에서 빼고 다음 모델로
  wait_hours: 24               # 분석 실패(무료 한도 초과 등) 시 재시도할 최대 시간. 지나면 제목·설명·썸네일만으로 요약

notify:
  provider: telegram           # telegram | ntfy | none
  ntfy_server: https://ntfy.sh
