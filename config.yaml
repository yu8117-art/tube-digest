# Tube Digest 동작 설정. 비밀값(API 키, 봇 토큰)은 여기 말고 .env에 둔다.
# 구독 채널 목록은 channels.yaml (.\td add "@핸들").

options:
  skip_shorts: true            # 쇼츠는 요약하지 않음
  transcript_languages: [ko, en]
  transcript_wait_hours: 6     # 자동 자막이 아직 없으면 최대 몇 시간 기다린 뒤 제목/설명/썸네일만으로 요약할지
  max_videos_per_run: 5        # 한 번 실행에 요약할 최대 영상 수 (비용 상한)
  backfill_on_first_run: 0     # 채널을 처음 등록할 때 최근 영상 몇 개를 요약할지 (0 = 이후 새 영상만)

claude:
  model: claude-sonnet-5-5       # 비용을 줄이려면 claude-sonnet-5-5 // claude-opus-5-5
  effort: medium               # low | medium | high

site:
  base_url: https://yu8117-art.github.io/tube-digest   # GitHub Pages 주소로 바꿀 것
  output_dir: docs             # Pages 소스 폴더 (main 브랜치 /docs)
  git_push: true              # 저장소 연결 후 true
  wait_until_live_sec: 180     # push 후 기사 URL이 열릴 때까지 기다리는 최대 시간

notify:
  provider: telegram           # telegram | ntfy | none
  ntfy_server: https://ntfy.sh
