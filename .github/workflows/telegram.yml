# 텔레그램 봇에 보낸 유튜브 링크를 요약해서 답장한다.
#
# - 웹훅 방식(기본): Cloudflare Worker(worker/worker.js)가 메시지를 받자마자 이 워크플로를 실행하고,
#   메시지를 inputs.update로 넘긴다. 메시지마다 실행이 따로 떠서 동시에 돌 수 있다.
# - 주기 확인 방식: 웹훅을 끄면(td webhook off) 아래 예약 실행이 5분마다 getUpdates로 새 메시지를 가져온다.
#   웹훅이 켜져 있는 동안 예약 실행은 바로 끝난다(텔레그램이 getUpdates를 막음).
name: telegram-requests

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      update:
        description: "텔레그램 메시지 JSON (웹훅 수신기가 넣는다). 비우면 getUpdates로 새 메시지를 확인"
        required: false
        default: ""

permissions:
  contents: write

# 주기 확인끼리는 겹치면 같은 메시지를 두 번 처리하므로 한 줄로 세운다.
# 웹훅 요청은 실행마다 그룹을 따로 줘서 동시에 돈다 (같은 그룹이면 대기 중인 실행이 취소돼 메시지를 잃는다).
concurrency:
  group: ${{ inputs.update && format('telegram-webhook-{0}', github.run_id) || 'telegram-poll' }}
  cancel-in-progress: false

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # 시작 시점의 최신 main을 받는다 (앞 실행이 올린 처리 위치·요약을 봐야 같은 일을 두 번 하지 않는다)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "tube-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 텔레그램 요청 요약·답장
        run: python -m tubedigest telegram
        env:
          # 메시지 내용은 셸 명령에 직접 넣지 않고 환경 변수로 넘긴다 (메시지 속 문자로 명령이 바뀌지 않게)
          TELEGRAM_UPDATE: ${{ inputs.update }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
