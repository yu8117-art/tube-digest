# GitHub Actions에서 15분마다: 새 영상 확인 → Gemini 요약 → 텔레그램 알림 → 처리 기록(data/) 커밋.
# 준비: Settings → Secrets에 GEMINI_API_KEY, YOUTUBE_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID 등록.
#       config.yaml의 options.git_push: true (기록을 커밋해야 다음 실행이 이어서 동작함)
name: tube-digest

on:
  schedule:
    - cron: "*/15 * * * *"   # Actions 예약 실행은 수 분~수십 분 늦을 수 있다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tube-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # 긴 영상은 Gemini 구간 분석 사이에 대기 시간이 있다
    steps:
      # 예약 실행은 '예약 시점'의 커밋을 받는데, 앞 실행을 기다리다 늦게 시작하면 그 사이 앞 실행이 올린 기록을 못 본다.
      # 그러면 같은 영상을 다시 요약해 알림이 중복되고 커밋이 충돌한다(2026-10-11 실측). 그래서 시작 시점의 최신 main을 받는다.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          git config user.name "tube-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 새 영상 확인 → 요약 → 알림
        run: python -m tubedigest run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
